name: Windows verification and portable build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Prepare test output
        shell: pwsh
        run: New-Item -ItemType Directory -Force test-output | Out-Null
      - name: Run Rust tests
        run: cargo test --locked -j 2 -- --test-threads=2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build portable executable
        shell: pwsh
        run: ./build.ps1 -SkipTests
      - name: Package Windows portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Generate SHA256
        shell: pwsh
        run: Get-FileHash runtime/pdfinator.exe -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 runtime/SHA256.txt
      - name: Upload Windows executable and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PDFinator-Windows-x64
          if-no-files-found: error
          path: |
            runtime/pdfinator.exe
            runtime/LICENCES.txt
            runtime/SHA256.txt
            dist/*-portable-exe-windows-x64.zip
