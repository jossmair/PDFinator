[package]
name = "pdfinator"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
pdfcraft-cos = { path = "vendor/pdfcraft/crates/cos" }
pdfcraft-content = { path = "vendor/pdfcraft/crates/content" }
pdfcraft-render = { path = "vendor/pdfcraft/crates/render" }
pdfcraft-edit = { path = "vendor/pdfcraft/crates/edit" }
pdfcraft-annot = { path = "vendor/pdfcraft/crates/annot" }
pdfcraft-model = { path = "vendor/pdfcraft/crates/model" }
pdfcraft-create = { path = "vendor/pdfcraft/crates/create" }
pdfcraft-fonts = { path = "vendor/pdfcraft/crates/fonts" }
pdfcraft-organize = { path = "vendor/pdfcraft/crates/organize" }
pdfcraft-export = { path = "vendor/pdfcraft/crates/export" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
rfd = "0.17"
tempfile = "3"
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
craft-print = { path = "vendor/craft-libs/crates/print" }

[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.1"
winreg = "0.55"
windows = { version = "0.62.2", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[dev-dependencies]
resvg = {version="0.45.1",default-features=false}
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[patch.crates-io]
hayro-interpret = { path = "vendor/pdfcraft/vendor/hayro-interpret" }
hayro = { path = "vendor/pdfcraft/vendor/hayro" }
hayro-syntax = { path = "vendor/pdfcraft/vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "vendor/pdfcraft/vendor/lopdf" }
winit = { path = "vendor/pdfcraft/vendor/winit" }
vello_common = { path = "vendor/pdfcraft/vendor/vello_common" }

[patch."https://github.com/storytold/winprint.rs"]
winprint = { path = "vendor/winprint" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
